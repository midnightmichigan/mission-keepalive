name: placement-digest
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check placement URL health
        run: python3 scripts/placement_digest.py
      - name: Commit status
        run: |
          git config user.name "mission-keepalive"
          git config user.email "mission-keepalive@users.noreply.github.com"
          git add status/placement-health.json
          git diff --cached --quiet || git commit -m "placement-digest: $(date -u +%FT%TZ)"
          git push

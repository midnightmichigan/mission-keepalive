name: referral-watch
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check referral pools
        run: python3 scripts/referral_watch.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit status
        run: |
          git config user.name "mission-keepalive"
          git config user.email "mission-keepalive@users.noreply.github.com"
          git add status/referral-watch.json
          git diff --cached --quiet || git commit -m "referral-watch: $(date -u +%FT%TZ)"
          git push

name: contest-watch
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan for urgent deadlines
        run: python3 scripts/contest_watch.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit status
        run: |
          git config user.name "mission-keepalive"
          git config user.email "mission-keepalive@users.noreply.github.com"
          git add status/contest-deadlines.json
          git diff --cached --quiet || git commit -m "contest-watch: $(date -u +%FT%TZ)"
          git push
